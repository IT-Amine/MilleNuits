copyright = "Copyright &copy; 2026 KADA Amine"
repo_url = "https://github.com/IT-Amine/MilleNuits"
repo_name = "IT-Amine/MilleNuits"
edit_uri = "edit/main/docs/"

[project.theme]
favicon = "assets/logo.png"
language = "fr"
logo = "assets/logo.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight"
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Passer au thème clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Passer au thème sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Passer aux préférences système"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/IT-Amine"

[project.markdown_extensions]
tables = {}
admonition = {}
attr_list = {}
def_list = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
pymdownx.tabbed.alternate_style = true
